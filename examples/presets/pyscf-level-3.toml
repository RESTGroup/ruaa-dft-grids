# PySCF Grids.level = 3 as a ruaa_dft_grids preset.
#
# One [[range]] per PySCF periodic row carries the level (n_rad, n_ang)
# pair; each element entry carries that element's Treutler radial scale
# and inherits n_rad and the angular layout from its range.  The range
# radial_scale is a placeholder that every element entry replaces.
#
# The element table is the compact form accepted by GridPreset's
# deserializer: one inline object per nuclear charge in a top-level
# array.  A [[element]] block per entry is accepted too.  The array must
# precede the [[range]] headers because TOML scopes bare keys to the
# last table header.
#
# Load it with any serde format: toml::from_str::<GridPreset>(..).

name = "pyscf-level-3"
radial = "treutler_ahlrichs"

