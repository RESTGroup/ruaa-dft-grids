# PySCF Grids.level = 3 as a ruaa_dft_grids preset.
#
# One [[range]] per PySCF periodic row carries the level (n_rad, n_ang)
# pair; each [[element]] entry carries that element's Treutler radial
# scale and inherits n_rad and the angular layout from the range.  The
# range radial_scale is a placeholder that every element entry replaces.
#
# Load it with any serde format: toml::from_str::<GridPreset>(..).

name = "pyscf-level-3"
radial = "treutler_ahlrichs"

# H, He
[[range]]
z_min = 1
z_max = 2
n_rad = 50
radial_scale = 1.0
angular = { pruned = { base = 302, prune = "nwchem" } }

# Li-Ne
[[range]]
z_min = 3
z_max = 10
n_rad = 75
radial_scale = 1.0
angular = { pruned = { base = 302, prune = "nwchem" } }

# Na-Ar
[[range]]
z_min = 11
z_max = 18
n_rad = 80
radial_scale = 1.0
angular = { pruned = { base = 434, prune = "nwchem" } }

# K-Kr
[[range]]
z_min = 19
z_max = 36
n_rad = 90
radial_scale = 1.0
angular = { pruned = { base = 434, prune = "nwchem" } }

# Rb-Xe
[[range]]
z_min = 37
z_max = 54
n_rad = 95
radial_scale = 1.0
angular = { pruned = { base = 434, prune = "nwchem" } }

# Cs-Rn
[[range]]
z_min = 55
z_max = 86
n_rad = 100
radial_scale = 1.0
angular = { pruned = { base = 434, prune = "nwchem" } }

# Fr-Lr (the Treutler scale table ends at Z = 103)
[[range]]
z_min = 87
z_max = 103
n_rad = 105
radial_scale = 1.0
angular = { pruned = { base = 434, prune = "nwchem" } }

