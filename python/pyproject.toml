[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ruaa-dft-grids-presets"
version = "0.1.0"
description = "Dependency-free reader and validator for ruaa_dft_grids preset files"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

[tool.setuptools]
packages = ["ruaa_dft_grids_presets"]
