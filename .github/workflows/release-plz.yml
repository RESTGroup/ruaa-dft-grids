name: Release-plz

# Manual only.  This workflow publishes the unpublished Cargo package, creates
# the version tag and opens the GitHub release.  Run it from main after the
# release PR is merged, the repository is public and CARGO_REGISTRY_TOKEN is
# configured.  It publishes only `ruaa-dft-grids`; the Python preset reader is
# repository tooling and is not released.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
