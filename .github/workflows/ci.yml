name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt, clippy, test, docs, package audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: --html-in-header katex-header.html -D warnings
        run: cargo doc --no-deps --locked

      - name: Package audit
        run: |
          set -euo pipefail
          cargo package --list --locked > package-files.txt
          if grep -Eq '^(agents/|\.github/|AGENTS|CLAUDE|.*\.local)' package-files.txt; then
            echo "repository-process material would be published" >&2
            exit 1
          fi
          for required in \
            Cargo.toml \
            Cargo.lock \
            LICENSE \
            NOTICE \
            README.md \
            CHANGELOG.md \
            katex-header.html \
            docs/presets.md \
            examples/presets/pyscf-level-3.toml \
            src/preset.rs \
            src/catalog.rs; do
            if ! grep -qx "$required" package-files.txt; then
              echo "required package file missing: $required" >&2
              exit 1
            fi
          done
          test "$(wc -l < package-files.txt)" -gt 50
          rm package-files.txt

  msrv:
    name: MSRV 1.87
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.87.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.87

      - name: Check the declared MSRV
        run: cargo check --all-targets --locked

  package:
    name: package verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package and test the tarball
        run: |
          set -euo pipefail
          cargo package --locked
          cargo test --manifest-path target/package/ruaa-dft-grids-0.1.0/Cargo.toml --locked

  publish-dry-run:
    name: publish dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo publish dry run
        run: cargo publish --dry-run --locked
