name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (fmt, clippy, test, docs, package audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Docs
        env:
          RUSTDOCFLAGS: --html-in-header katex-header.html -D warnings
        run: cargo doc --no-deps --locked

      - name: Package audit
        run: |
          set -euo pipefail
          cargo package --list --locked > package-files.txt
          if grep -Eq '^(agents/|\.github/|AGENTS|CLAUDE|.*\.local)' package-files.txt; then
            echo "repository-process material would be published" >&2
            exit 1
          fi
          test "$(wc -l < package-files.txt)" -gt 200
          rm package-files.txt

  msrv:
    name: MSRV 1.87
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.87.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.87

      - name: Check the declared MSRV
        run: cargo check --all-targets --locked

  bindings:
    name: bindings (workspace, C ABI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Install cbindgen
        run: cargo install cbindgen --version 0.29.4 --locked

      - name: C header freshness
        run: sh crates/ruaa-dft-grids-capi/tests/check_header.sh

      - name: C ABI smoke (C, C++, static)
        run: sh crates/ruaa-dft-grids-capi/tests/smoke.sh

      - name: C install and pkg-config
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/capi-stage"
          rm -rf "$stage"
          make -C crates/ruaa-dft-grids-capi install DESTDIR="$stage" PREFIX=/usr/local
          export PKG_CONFIG_PATH="$stage/usr/local/lib/pkgconfig"
          test "$(pkg-config --modversion ruaa_dft_grids)" = "0.1.0"
          cc -std=c11 -Wall -Wextra -Werror \
            crates/ruaa-dft-grids-capi/examples/build_grid.c \
            $(pkg-config --cflags --libs ruaa_dft_grids) \
            -o "$RUNNER_TEMP/capi-installed"
          LD_LIBRARY_PATH="$stage/usr/local/lib" "$RUNNER_TEMP/capi-installed" > /dev/null

  python:
    name: Python wheel and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install tooling
        run: python -m pip install --upgrade pip maturin numpy pytest

      - name: Build and install the wheel
        working-directory: crates/ruaa-dft-grids-python
        run: |
          maturin build --release --out dist
          python -m pip install --force-reinstall dist/*.whl

      - name: Pytest
        working-directory: crates/ruaa-dft-grids-python
        run: python -m pytest -q tests

  package:
    name: package verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package and test the tarball
        run: |
          set -euo pipefail
          cargo package --locked
          cargo test --manifest-path target/package/ruaa-dft-grids-0.1.0/Cargo.toml --locked

  publish-dry-run:
    name: publish dry-run
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Cargo publish dry run
        run: cargo publish --dry-run --locked
