name: Release-plz PR

# Manual only.  This workflow opens or updates the release pull request with
# the next version.  Review and merge that PR before dispatching the release
# workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-plz-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          # A fine-grained PAT with repository contents and pull-request
          # write access can be supplied as RELEASE_PLZ_TOKEN when the
          # organization blocks the built-in token from creating PRs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
